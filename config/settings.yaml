# Configuration utilisateur du bot.
# Édite ces valeurs selon tes préférences.

# --- Comportement général ---

# Par défaut, le bot tourne en dry-run (aucun appel d'écriture vers ManyReach).
# Passe à false UNIQUEMENT quand tu es confiant.
default_dry_run: true

# Seuil de confidence en-dessous duquel on ne fait JAMAIS d'auto-send.
# Le draft est généré, mais reste en review.
min_autosend_confidence: 0.92

# Comportement sur not_interested_polite.
# Rudy a confirmé : il répond TOUJOURS (politesse + referral-ask + valeur), pas de silence.
# Mettre à true uniquement si tu veux override ce comportement par défaut.
silent_on_not_interested: false

# Nombre max de replies traités par run (utile pour les premiers tests).
# null = pas de limite.
limit_per_run: 20

# Si null, on traite toutes les campagnes. Sinon liste d'IDs.
campaign_filter: null
#  - 11572

# --- Identité ---
# La voice, les signatures par entité, et les liens backup sont définis
# dans training_examples.md (sections "Voice globale" + "Entités"). Le drafter
# parse ce doc directement — pas besoin de dupliquer ici.

# --- Calendrier (phase 2 — Google Calendar) ---
# Pour l'instant, le bot utilise un pattern textuel pour les créneaux.
# En phase 2, on connectera Google Calendar.

calendar:
  enabled: true
  timezone: "Europe/Paris"
  # Horaires bookables de Rudy : 9h30-11h et 12h-17h30
  # (jamais avant 9h30 ni après 17h30 ; pause course à pied 11h-12h exclue)
  working_hours:
    monday:    [["09:30", "11:00"], ["12:00", "17:30"]]
    tuesday:   [["09:30", "11:00"], ["12:00", "17:30"]]
    wednesday: [["09:30", "11:00"], ["12:00", "17:30"]]
    thursday:  [["09:30", "11:00"], ["12:00", "17:30"]]
    friday:    [["09:30", "11:00"], ["12:00", "17:30"]]
  meeting_duration_minutes: 30
  buffer_minutes: 15
  days_ahead: 5
  hold_days: 5
  # Jamais de créneau à moins de 3h du moment présent
  min_lead_hours: 3
  # Si on discute après 16h, ne pas proposer le lendemain avant cette heure
  # (Rudy ne verrait pas un RDV tôt le lendemain matin)
  late_cutoff_hour: 16
  next_day_min_time_if_late: "10:30"
  # Lien Zoom de secours si le prospect veut absolument une visio
  zoom_link: "https://us02web.zoom.us/s/9136208131"

# --- Cadence de relance (follow-up) ---
# Combien de fois et quand le bot relance selon l'état du lead.
followups:
  # Intéressé / demande d'info SANS RDV calé → on relance pour obtenir le RDV
  interested_awaiting_booking:
    bump_after_days: [2, 5]   # relance #1 à J+2, #2 à J+5
    then: "nurture"           # après, on arrête et on archive en nurture long terme
  # Objection timing avec date mentionnée → recontact à la date
  objection_timing:
    recontact: "date_mentioned_or_3_months"
  # Pas intéressé / déjà équipé / mauvaise personne → 1 seule réponse, pas de relance
  one_shot_no_bump: ["not_interested_polite", "objection_already_have_solution", "wrong_person_redirect"]
  # RDV confirmé → 1 accusé "c'est noté" puis STOP total
  meeting_confirmed: "ack_then_stop"

# --- Logs ---

logs:
  dir: "logs"
  format: "jsonl"  # jsonl = un JSON par ligne, facile à grep
